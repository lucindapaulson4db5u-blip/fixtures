version: 2.1

jobs:
  preflight_MERGE_PROD:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Snapshot heap stats
          command: |
            mkdir -p /tmp/data
            set +o pipefail 2>/dev/null; yes abc | head -n 642170 | sha1sum > /tmp/data/2024-04-17.data; true
            stat -c '%s %n' /tmp/data/2024-04-17.data
      - persist_to_workspace:
          root: /tmp/data
          paths:
            - 2024-04-17.data
  MERGE_PROD:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data
      - run:
          name: Ingest handoff
          command: |
            { od -An -c /tmp/data/2024-04-17.data 2>/dev/null | head -3; echo "od ok" ; } || true
      - run:
          name: Shallow clone
          command: git clone --quiet --single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore vendored sources
          command: cat bundle-v2.tar.xz | tar xJf -
